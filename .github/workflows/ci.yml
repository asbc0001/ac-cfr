name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          .venv/bin/python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Check types
        run: .venv/bin/pyright

      - name: Run fast tests
        run: .venv/bin/pytest

      - name: Build wheel
        run: .venv/bin/python -m build --wheel

      - name: Smoke-test installed wheel outside the checkout
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c "from ac_cfr.games.holdem.evaluator import evaluate_holdem; assert evaluate_holdem((48, 44), (40, 36, 32, 0, 5)) == 1"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c "from importlib.resources import files; static = files('ac_cfr.web').joinpath('static'); assert static.joinpath('index.html').is_file(); assert static.joinpath('app.js').is_file(); assert static.joinpath('styles.css').is_file()"
          for command in ac-cfr-train ac-cfr-benchmark ac-cfr-evaluate ac-cfr-plot-results ac-cfr-download-models ac-cfr-web; do
            "${RUNNER_TEMP}/wheel-smoke/bin/${command}" --help >/dev/null
          done

      - name: Build and smoke-test web container
        run: |
          docker build --tag ac-cfr-web:ci .
          docker run --detach --name ac-cfr-web-smoke ac-cfr-web:ci
          trap 'docker rm --force ac-cfr-web-smoke' EXIT
          for attempt in {1..20}; do
            if docker exec ac-cfr-web-smoke python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200"; then
              exit 0
            fi
            sleep 1
          done
          docker logs ac-cfr-web-smoke
          exit 1
