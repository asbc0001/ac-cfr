[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-cfr"
version = "0.1.0"
description = "Counterfactual regret minimisation poker research project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not slow and not gpu and not cloud and not benchmark",
]
testpaths = ["tests"]
markers = [
    "slow: tests that are too expensive for the default test suite",
    "gpu: tests that require a compatible GPU",
    "cloud: tests that require cloud infrastructure",
    "benchmark: performance measurements that are not correctness tests",
]

[tool.ruff]
required-version = "==0.15.22"
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true

