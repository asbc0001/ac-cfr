format_version = 4

# Starting production candidate used by collect-once calibration and the later shakedown.
# The calibration command independently fits one diagnostic network through 32k updates.
[run]
implementation = "optimised"
checkpoint_interval = 1
checkpoint_retention = 2

[training]
iterations = 1
traversals_per_player = 10000
advantage_reservoir_capacity = 10000000
strategy_reservoir_capacity = 10000000
advantage_training_steps = 16000
strategy_training_steps = 16000
advantage_batch_size = 10000
strategy_batch_size = 10000
learning_rate = 0.001
validation_fraction = 0.1
max_gradient_norm = 1.0
dropout_probability = 0.0
seed = 20260811
snapshot_iterations = []
game_configuration_id = "modified_hulhe"
model_config_id = "modified_hulhe_deep_cfr"
state_encoding_id = "holdem"
optimizer_id = "adam"

[runtime]
inference_batch_size = 1024
cpu_threads = 1
device = "cuda"
# Zero resolves once from effective CPU capacity while preserving coordinator capacity.
traversal_workers = 0
storage_budget_bytes = 200000000000
